name: Bug report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser (if relevant), project version.
      placeholder: |
        - OS: Ubuntu 24.04
        - Docker: 27.x
        - Browser: Firefox 136
        - Version: v0.1.0
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or error messages.
      render: text
